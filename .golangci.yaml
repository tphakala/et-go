# Copied from github.com/tphakala/agy-mcp (itself adapted from go-flac and
# birdnet-go) to keep one linting standard across projects, including the
# rules/*.go ruleguard matchers. et-go-specific adaptation:
#   - gocritic hugeParam stays enabled: packets and frames are on the I/O hot
#     path, so large values passed by value are worth flagging here.
version: "2"
output:
  sort-order:
    - linter
    - severity
    - file
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - iface
    - ineffassign
    - misspell
    - modernize
    - nilerr
    - nilnil
    - nosprintfhostport
    - predeclared
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unused
    - usetesting
    - wastedassign
  settings:
    gocognit:
      min-complexity: 50
    gocritic:
      # gocritic auto-enables the ruleguard check when settings.ruleguard.rules
      # is set; the rules/*.go matchers carry the //go:build ruleguard tag so
      # the normal toolchain ignores them.
      disabled-checks:
        - commentFormatting
        - commentedOutCode
      enabled-tags:
        - style
        - diagnostic
        - performance
      settings:
        ruleguard:
          rules: "rules/*.go"
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    exhaustive:
      default-signifies-exhaustive: true
    usetesting:
      # Both default to false upstream (ldez/usetesting); without these,
      # usetesting silently does not flag context.Background()/context.TODO()
      # in tests at all, verified empirically with the pinned golangci-lint
      # version, so leaving them off would make the rules/doc.go policy
      # comment's "usetesting covers the same ground as TestingContext" claim
      # false as configured.
      context-background: true
      context-todo: true
  exclusions:
    rules:
      # goconst gained cross-file scanning in golangci-lint v2.12 (the old
      # ignore-tests setting was removed from the v2 config schema); without
      # this, idiomatic literal repetition across _test.go files floods the
      # linter with noise that isn't worth extracting into constants.
      - path: '_test\.go'
        linters:
          - goconst
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new: false
